<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solutions — Insight Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     TOKENS
     ============================================================ */
  :root {
    --bg: #0b0d10;
    --panel: #14171b;
    --panel-2: #191d22;
    --ink: #edeff2;
    --muted: #99a1ac;
    --line: rgba(255,255,255,0.09);
    --accent: #d9a441;      /* gold — growing */
    --accent-2: #5fa3a0;    /* teal — startup */
    --accent-3: #7c93c2;    /* soft blue — established */
    --accent-4: #c97a63;    /* clay — tailored */
    --warn: #c97a63;
    --radius: 16px;
    --radius-sm: 10px;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  /* Header Section */

  .wrap {
    margin: 0 auto;
    max-width: 1180px;
    padding: 3rem clamp(1.5rem, 5vw, 4.5rem);
    z-index: 2;
    position: relative;
  }

  /* ============================================================
     EYEBROW / HEADLINE
     ============================================================ */
  .sh2-header {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    max-width: 620px;
  }

  .sh2-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--accent);
  }

  .sh2-eyebrow::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 2px;
    background: var(--accent);
    display: inline-block;
    transform: rotate(45deg);
  }

  .sh2-headline {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.9rem, 3.4vw, 2.7rem);
    line-height: 1.15;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .sh2-sub {
    margin: 0;
    color: var(--muted);
    font-size: clamp(0.92rem, 1.3vw, 1.02rem);
    line-height: 1.6;
    max-width: 50ch;
  }

  /* ============================================================
     HEADER — headline/subheadline left, tabs right
     ============================================================ */
  .blog-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 1.75rem;
    margin-bottom: 3rem;
  }

  .blog-tabs {
    display: flex;
    gap: 0.4rem;
    background: rgba(255, 255, 255, 0.03);
    padding: 0.35rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .tab-btn {
    all: unset;
    cursor: pointer;
    padding: 0.55rem 1.2rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    transition: background 0.2s ease, color 0.2s ease;
    white-space: nowrap;
  }

  .tab-btn:hover { color: var(--ink); }

  .tab-btn.active {
    background: var(--accent);
    color: #17140c;
  }

  /* ============================================================
     BLOG GRID / CARDS
     ============================================================ */
  .blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.25rem;
  }

  .blog-card {
    all: unset;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.75rem;
    min-height: 220px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--card-accent, var(--accent));
    border-radius: var(--radius);
    transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  }

  .blog-card:hover {
    transform: translateY(-3px);
    background: var(--panel-2);
  }

  .blog-card[data-category="startup"]     { --card-accent: var(--accent-2); }
  .blog-card[data-category="growing"]     { --card-accent: var(--accent); }
  .blog-card[data-category="established"] { --card-accent: var(--accent-3); }
  .blog-card[data-category="tailored"]    { --card-accent: var(--accent-4); }

  .blog-card__meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    gap: 0.75rem;
  }

  .blog-card__tag {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--card-accent, var(--accent));
  }

  .blog-card__time {
    font-size: 0.78rem;
    color: var(--muted);
    text-align: right;
  }

  .blog-card__title {
    margin: 0 0 0.5rem;
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 500;
    line-height: 1.3;
  }

  .blog-card__desc {
    margin: 0;
    font-size: 0.87rem;
    color: var(--muted);
    line-height: 1.55;
  }

  .blog-card__footer {
    margin-top: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.83rem;
    font-weight: 600;
    color: var(--ink);
    transition: gap 0.25s ease, color 0.25s ease;
  }

  .blog-card__footer svg { transition: transform 0.25s ease; }
  .blog-card:hover .blog-card__footer svg { transform: translateX(3px); }

  .blog-empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
    font-size: 0.9rem;
  }

  /* ============================================================
     OVERLAY — tab rail left, content right
     ============================================================ */
  .overlay-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 7, 8, 0.72);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease;
    z-index: 100;
  }

  .overlay-backdrop.active {
    opacity: 1;
    visibility: visible;
  }

  .overlay-panel {
    position: relative;
    width: min(1040px, 100%);
    height: min(640px, 88vh);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    overflow: hidden;
    transform: translateY(12px);
    transition: transform 0.25s ease;
  }

  .overlay-backdrop.active .overlay-panel {
    transform: translateY(0);
  }

  .overlay-close {
    all: unset;
    cursor: pointer;
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.04);
    z-index: 5;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .overlay-close:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink);
  }

  /* left: tab rail */
  .overlay-list {
    width: 230px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    padding: 1.5rem 1rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    background: var(--panel-2);
  }

  .overlay-list .rail-label {
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    color: var(--muted);
    padding: 0 0.6rem 0.75rem;
  }

  .overlay-list button {
    all: unset;
    cursor: pointer;
    padding: 0.75rem 0.75rem;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    gap: 0.7rem;
    transition: background 0.15s ease;
  }

  .overlay-list button:hover { background: rgba(255, 255, 255, 0.04); }
  .overlay-list button.active { background: rgba(217, 164, 65, 0.12); }

  .overlay-list .rail-icon {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    color: var(--muted);
  }

  .overlay-list button.active .rail-icon {
    background: var(--accent);
    color: #17140c;
  }

  .overlay-list .item-title {
    font-size: 0.87rem;
    font-weight: 600;
    color: var(--muted);
    line-height: 1.3;
  }
  .overlay-list button.active .item-title { color: var(--ink); }

  /* right: content */
  .overlay-content {
    flex: 1;
    padding: 2.75rem 3rem;
    overflow-y: auto;
  }

  .ov-post-head {
    margin-bottom: 1.75rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--line);
  }

  .ov-post-head .tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--tag-color, var(--accent));
    margin-bottom: 0.5rem;
  }

  .ov-post-head h2 {
    margin: 0 0 0.4rem;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.8rem;
    line-height: 1.2;
  }

  .ov-post-head .fit {
    color: var(--muted);
    font-size: 0.88rem;
  }

  .overlay-pane { display: none; animation: fadeIn 0.3s ease; }
  .overlay-pane.active { display: block; }

  .ov-pane-headline {
    margin: 0 0 0.4rem;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.35rem;
    line-height: 1.3;
  }

  .ov-pane-sub {
    margin: 0 0 1.5rem;
    color: var(--muted);
    line-height: 1.65;
    font-size: 0.95rem;
    max-width: 60ch;
  }

  /* Overview chips */
  .ov-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-top: 1.5rem;
  }

  .ov-chip {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.82rem;
    color: var(--ink);
    background: var(--panel-2);
  }

  .ov-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  /* Problem list */
  .ov-problem-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-top: 1.25rem;
  }

  .ov-problem-item {
    display: flex;
    gap: 0.85rem;
    align-items: flex-start;
    padding: 0.95rem 1.1rem;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--warn);
    border-radius: var(--radius-sm);
  }

  .ov-problem-item svg { flex-shrink: 0; color: var(--warn); margin-top: 0.15rem; }
  .ov-problem-item p { margin: 0; font-size: 0.9rem; color: var(--ink); line-height: 1.5; }

  /* Deliver grid */
  .ov-deliver-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    margin-top: 1.25rem;
  }

  .ov-mock-card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .ov-mock-card .mock-canvas {
    width: 100%;
    height: 110px;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
  }

  .ov-mock-card .mock-caption {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.4;
  }

  /* Outcome metrics */
  .ov-outcome-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-top: 1.25rem;
  }

  .ov-stat-card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 1.25rem;
  }

  .ov-stat-card .stat-value {
    font-family: var(--font-display);
    font-size: 1.9rem;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .ov-stat-card .stat-label {
    font-size: 0.83rem;
    color: var(--muted);
    line-height: 1.45;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 640px) {
    .blog-header { align-items: flex-start; }
    .blog-tabs {
      width: 100%;
      overflow-x: auto;
      border-radius: 15px;
    }

    .overlay-backdrop { padding: 0; }
    .overlay-panel { flex-direction: column; height: 94vh; border-radius: 0; }
    .overlay-list {
      width: 100%;
      flex-direction: row;
      overflow-x: auto;
      border-right: none;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      padding: 1rem 0.75rem;
    }
    .overlay-list .rail-label { display: none; }
    .overlay-list button { flex-direction: column; align-items: center; min-width: 92px; text-align: center; gap: 0.4rem; }
    .overlay-list .item-title { font-size: 0.72rem; }
    .overlay-content { padding: 1.75rem 1.5rem; }
    .ov-post-head h2 { font-size: 1.45rem; }
  }
</style>
</head>

</div>

    }

    grid.innerHTML = data.map(post => `
      <button class="blog-card" data-id="${post.id}" data-category="${post.category}">
        <div>
          <div class="blog-card__meta">
            <span class="blog-card__tag">${CATEGORY_LABEL[post.category]}</span>
            <span class="blog-card__time">${post.fit}</span>
          </div>
          <h3 class="blog-card__title">${post.title}</h3>
          <p class="blog-card__desc">${post.desc}</p>
        </div>
        <div class="blog-card__footer">
          <span>View solution</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </button>
    `).join("");
  }

  // Render overlay tab list
  function renderTabRail() {
    overlayList.innerHTML = `<div class="rail-label">Explore solution details</div>` + TABS.map((t, i) => `
      <button data-tab="${t.key}" class="${i === 0 ? "active" : ""}">
        <span class="rail-icon">${t.icon}</span>
        <span class="item-title">${t.label}</span>
      </button>
    `).join("");
  }

  // Render content panes inside overlay
  function renderContent(post) {
    const accentVar = { startup: "var(--accent-2)", growing: "var(--accent)", established: "var(--accent-3)", tailored: "var(--accent-4)" }[post.category];

    const overviewPane = `
      <div class="overlay-pane active" data-pane="overview">
        <h3 class="ov-pane-headline">${post.overview.headline}</h3>
        <p class="ov-pane-sub">${post.overview.body}</p>
        <div class="ov-chip-row">
          ${post.overview.chips.map(c => `<span class="ov-chip"><span class="dot"></span>${c}</span>`).join("")}
        </div>
      </div>`;

    const problemPane = `
      <div class="overlay-pane" data-pane="problem">
        <h3 class="ov-pane-headline">${post.problem.headline}</h3>
        <p class="ov-pane-sub">${post.problem.body}</p>
        <div class="ov-problem-list">
          ${post.problem.pains.map(p => `
            <div class="ov-problem-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <p>${p}</p>
            </div>
          `).join("")}
        </div>
      </div>`;

    const deliverPane = `
      <div class="overlay-pane" data-pane="deliver">
        <h3 class="ov-pane-headline">${post.deliver.headline}</h3>
        <p class="ov-pane-sub">${post.deliver.sub}</p>
        <div class="ov-deliver-grid">
          ${post.deliver.mockups.map(m => `
            <div class="ov-mock-card">
              <div class="mock-canvas">${renderMock(m.type)}</div>
              <div class="mock-caption">${m.caption}</div>
            </div>
          `).join("")}
        </div>
      </div>`;

    const outcomePane = `
      <div class="overlay-pane" data-pane="outcome">
        <h3 class="ov-pane-headline">${post.outcome.headline}</h3>
        <p class="ov-pane-sub">${post.outcome.sub}</p>
        <div class="ov-outcome-grid">
          ${post.outcome.metrics.map(m => `
            <div class="ov-stat-card">
              <div class="stat-value">${m.value}</div>
              <div class="stat-label">${m.label}</div>
            </div>
          `).join("")}
        </div>
      </div>`;

    overlayContent.innerHTML = `
      <div class="ov-post-head" style="--tag-color:${accentVar}">
        <span class="tag">${CATEGORY_LABEL[post.category]}</span>
        <h2>${post.title}</h2>
        <span class="fit">${post.fit}</span>
      </div>
      <div class="ov-panes">
        ${overviewPane}${problemPane}${deliverPane}${outcomePane}
      </div>
    `;
  }

  function setActiveTab(key) {
    overlayList.querySelectorAll("button[data-tab]").forEach(b =>
      b.classList.toggle("active", b.dataset.tab === key)
    );
    overlayContent.querySelectorAll(".overlay-pane").forEach(pane =>
      pane.classList.toggle("active", pane.dataset.pane === key)
    );
  }

  function openOverlay(id) {
    const post = posts.find(p => p.id === id);
    if (!post) return;
    renderContent(post);
    overlayList.querySelectorAll("button[data-tab]").forEach((b, i) => b.classList.toggle("active", i === 0));
    overlayBackdrop.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeOverlay() {
    overlayBackdrop.classList.remove("active");
    document.body.style.overflow = "";
  }

  // Filter tabs click listener
  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      renderGrid(tab.dataset.filter);
    });
  });

  // Card click event delegation
  grid.addEventListener("click", e => {
    const card = e.target.closest(".blog-card");
    if (!card) return;
    openOverlay(card.dataset.id);
  });

  // Overlay tab rail click event listener
  overlayList.addEventListener("click", e => {
    const btn = e.target.closest("button[data-tab]");
    if (!btn) return;
    setActiveTab(btn.dataset.tab);
  });

  // Close handlers
  overlayClose.addEventListener("click", closeOverlay);
  overlayBackdrop.addEventListener("click", e => {
    if (e.target === overlayBackdrop) closeOverlay();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && overlayBackdrop.classList.contains("active")) closeOverlay();
  });

  // Init
  renderGrid("all");
  renderTabRail();
})();
</script>
</body>
</html>
