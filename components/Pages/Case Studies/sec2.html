<div class="wrap">
  <header class="page-header">
    <div class="sh2-header sh2-center" id="sh2Header">
      <div class="sh2-eyebrow sh2-eyebrow">
        WHY BUSINESSES CHOOSE INSIGHT GRID
      </div>
      <h2 class="sh2-headline sh2-headline">
        Eliminate Repetitive Work, Accelerate Better Decisions.
      </h2>
      <p class="sh2-sub sh2-sub">
        From workflow automation to advanced analytics, every solution is
        engineered to save time, improve accuracy, and help you scale.
      </p>
    </div>
  </header>

  <div class="controls">
    <div class="search-box">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="searchInput"
        placeholder="Search case studies..."
      />
    </div>

    <div class="filter-pills" id="industryFilters">
      <button class="active" data-industry="all">All Industries</button>
      <button data-industry="Healthcare">Healthcare</button>
      <button data-industry="Finance">Finance</button>
      <button data-industry="Retail">Retail</button>
      <button data-industry="Logistics">Logistics</button>
      <button data-industry="Education">Education</button>
    </div>

    <div class="sort-box">
      <select id="sortSelect">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="az">Title A–Z</option>
        <option value="za">Title Z–A</option>
      </select>
    </div>
  </div>

  <div class="results-meta" id="resultsMeta"></div>

  <div class="grid" id="grid"></div>

  <div class="empty-state" id="emptyState" style="display: none">
    <strong>No case studies found</strong>
    Try a different search term or industry filter.
  </div>
</div>
