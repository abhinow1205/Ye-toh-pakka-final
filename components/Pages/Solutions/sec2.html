<div class="wrap">
  <div class="container">
    <div class="blog-header">
      <div class="sh2-header sh2-center" id="sh2Header">
        <div class="sh2-eyebrow">SOLUTIONS FOR HOW YOU WORK</div>
        <h2 class="sh2-headline">
          Turn Business Challenges Into Smarter Systems
        </h2>
        <p class="sh2-sub">
          From automating repetitive work to centralizing data and improving
          decision-making, we design practical solutions around the way your
          business actually operates.
        </p>
      </div>

      <div class="blog-tabs" id="blogTabs">
        <button class="tab-btn active" data-filter="all">All</button>
        <button class="tab-btn" data-filter="startup">Startup</button>
        <button class="tab-btn" data-filter="growing">Growing</button>
        <button class="tab-btn" data-filter="established">Established</button>
        <button class="tab-btn" data-filter="tailored">Tailored</button>
      </div>
    </div>

    <!-- Cards -->
    <div class="blog-grid" id="blogGrid"></div>
  </div>

  <!-- Overlay -->
  <div class="overlay-backdrop" id="overlayBackdrop">
    <div class="overlay-panel" id="overlayPanel">
      <button class="overlay-close" id="overlayClose" aria-label="Close">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>

      <div class="overlay-list" id="overlayList"></div>
      <div class="overlay-content" id="overlayContent"></div>
    </div>
  </div>
</div>
