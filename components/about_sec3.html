<!-- ===================== STATS ===================== -->
<section class="section_3">
  <div class="sh3-header sh3-center" id="sh3Header">
    <div class="sh3-eyebrow sh3-eyebrow">By the numbers</div>
    <h2 class="sh3-headline sh3-headline">
      A small team, a lot of hours given back.
    </h2>
    <p class="sh3-sub sh3-sub">
      We measure ourselves less by revenue and more by how much time we've
      handed back to the people who use Insight Grid every day.
    </p>
  </div>

  <div class="au-stats-grid" id="auStatsGrid">
    <div class="au-stat">
      <div class="au-stat-num" data-target="40" data-suffix="K+">0</div>
      <div class="au-stat-label">Teams automating with Insight Grid</div>
    </div>
    <div class="au-stat">
      <div class="au-stat-num" data-target="12" data-suffix="M+">0</div>
      <div class="au-stat-label">Hours saved every month</div>
    </div>
    <div class="au-stat">
      <div class="au-stat-num" data-target="99.98" data-suffix="%">0</div>
      <div class="au-stat-label">Platform uptime</div>
    </div>
    <div class="au-stat">
      <div class="au-stat-num" data-target="120" data-suffix="+">0</div>
      <div class="au-stat-label">Countries running Insight Grid</div>
    </div>
  </div>
</section>
