          id="minimal_outline"
        >
          <i data-lucide="mail"></i>

<div class="mobile-overlay mobile-only" id="mobileOverlay">
  <div class="mobile-overlay-inner">
    <ul class="m-list" id="mobileNavList"></ul>
    <div class="mobile-actions">
      <a href="mailto:solutions@insightgrid.in" class="btn btn-ghost"
        >Email Us</a
      >
      <a href="#" class="btn btn-solid">Request Quote</a>

<div class="quote-overlay" id="quoteOverlay">
  <div class="quote-modal">
    <button class="quote-modal-close" id="quoteCloseBtn" aria-label="Close">
      &times;
    </button>
    <h3>Request a Quote</h3>
    <p class="quote-modal-sub">
      Tell us a bit about your project and we'll get back to you shortly.
    </p>
    <form id="quoteForm">
      <div class="quote-field">
        <label for="quoteName">Name</label>
        <input type="text" id="quoteName" name="name" required />
      </div>
      <div class="quote-field">
        <label for="quoteCompany">Company</label>
        <input type="text" id="quoteCompany" name="company" required />
      </div>
      <div class="quote-field">
        <label for="quoteDescription">Description</label>
        <textarea
          id="quoteDescription"
          name="description"
          rows="4"
          required
        ></textarea>
      </div>
      <button
        type="submit"
        class="btn btn-solid quote-submit"
        id="quoteSubmitBtn"
      >
        Submit
      </button>
      <p class="quote-status" id="quoteStatus"></p>
    </form>
  </div>
</div>
