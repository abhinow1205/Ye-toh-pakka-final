<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Responsive Navbar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
      :root {
        --bg: #0b0b0d;
        --panel: #131317;
        --card: #17181c;
        --ink: #f5f1e8;
        --muted: #93938c;
        --line: #26272d;
        --accent: #cda45e;
        --nav-h: clamp(64px, 6vw + 40px, 84px);

        --fs-logo: clamp(1.1rem, 0.9rem + 1vw, 1.5rem);
        --fs-nav: clamp(0.82rem, 0.7rem + 0.4vw, 0.95rem);
        --fs-sub-title: clamp(0.85rem, 0.75rem + 0.3vw, 0.95rem);
        --fs-sub-desc: clamp(0.72rem, 0.65rem + 0.2vw, 0.8rem);
        --fs-btn: clamp(0.78rem, 0.68rem + 0.3vw, 0.92rem);
        --fs-mobile: clamp(1.05rem, 0.9rem + 1.4vw, 1.4rem);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", sans-serif;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
      }

      /* Demo page filler so you can see the navbar in context */
      .page-filler {
        padding-top: calc(var(--nav-h) + 4rem);
        min-height: 220vh;
        max-width: 800px;
        margin: 0 auto;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
        color: var(--muted);
        line-height: 1.7;
      }

      .page-filler h1 {
        font-family: "Fraunces", serif;
        color: var(--ink);
        font-size: clamp(1.8rem, 4vw, 2.8rem);
      }

      /* ===================== NAVBAR SHELL ===================== */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--nav-h);
        z-index: 500;
        background: rgba(11, 11, 13, 0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }

      .navbar-inner {
        height: 100%;
        max-width: 1300px;
        margin: 0 auto;
        padding: 0 clamp(1.25rem, 3vw, 2.5rem);
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 1rem;
      }

      /* ===================== LOGO ===================== */
      .logo {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: var(--fs-logo);
        white-space: nowrap;
        letter-spacing: -0.01em;
      }

      .logo .dot {
        color: var(--accent);
      }

      /* ===================== DESKTOP CENTER NAV ===================== */
      .desktop-only {
      }

      .nav-center {
        display: flex;
        justify-content: center;
      }

      .nav-list {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .nav-item {
        position: relative;
      }

      .nav-link {
        all: unset;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        cursor: pointer;
        padding: 0.55rem 0.9rem;
        border-radius: 999px;
        font-size: var(--fs-nav);
        color: var(--ink);
        transition:
          background 0.25s ease,
          color 0.25s ease;
      }

      .nav-item:hover .nav-link {
        background: rgba(255, 255, 255, 0.06);
      }

      .nav-item.pinned .nav-link {
        background: rgba(205, 164, 94, 0.14);
        color: var(--accent);
      }

      .chevron {
        transition: transform 0.25s ease;
        flex-shrink: 0;
      }
      .nav-item:hover .chevron,
      .nav-item.pinned .chevron {
        transform: rotate(180deg);
      }

      /* ===================== DROPDOWN PANEL (level 2) ===================== */
      .dropdown-panel {
        position: absolute;
        top: calc(100% + 14px);
        left: 50%;
        min-width: 320px;
        transform: translate(-50%, 10px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          visibility 0.25s;
        z-index: 10;
      }

      .dropdown-panel.align-start {
        left: 0;
        transform: translate(0, 10px);
      }
      .dropdown-panel.align-end {
        left: auto;
        right: 0;
        transform: translate(0, 10px);
      }

      .nav-item:hover .dropdown-panel,
      .nav-item.pinned .dropdown-panel {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translate(-50%, 0);
      }

      .nav-item:hover .dropdown-panel.align-start,
      .nav-item.pinned .dropdown-panel.align-start,
      .nav-item:hover .dropdown-panel.align-end,
      .nav-item.pinned .dropdown-panel.align-end {
        transform: translate(0, 0);
      }

      .dropdown-inner {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 0.6rem;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }

      .dropdown-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .dropdown-item {
        position: relative;
        border-radius: 12px;
      }

      .dropdown-link {
        all: unset;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        width: 100%;
        padding: 0.7rem 0.85rem;
        border-radius: 12px;
        cursor: pointer;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .dropdown-link:hover {
        background: rgba(255, 255, 255, 0.055);
      }

      .dropdown-item.has-flyout.pinned > .dropdown-link {
        background: rgba(205, 164, 94, 0.12);
        color: var(--accent);
      }

      .dropdown-link-title {
        display: block;
        font-size: var(--fs-sub-title);
        font-weight: 500;
        color: var(--ink);
      }

      .dropdown-item.has-flyout.pinned .dropdown-link-title,
      .dropdown-link:hover .dropdown-link-title {
        color: var(--ink);
      }

      .dropdown-link-desc {
        display: block;
        font-size: var(--fs-sub-desc);
        color: var(--muted);
        margin-top: 0.15rem;
      }

      .chevron-right {
        color: var(--muted);
      }

      /* ===================== FLYOUT PANEL (level 3) ===================== */
      .flyout-panel {
        position: absolute;
        top: -0.6rem;
        left: 100%;
        margin-left: 10px;
        min-width: 220px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateX(8px);
        transition:
          opacity 0.22s ease,
          transform 0.22s ease,
          visibility 0.22s;
      }

      .has-flyout.flyout-left .flyout-panel {
        left: auto;
        right: 100%;
        margin-left: 0;
        margin-right: 10px;
        transform: translateX(-8px);
      }

      .has-flyout:hover .flyout-panel,
      .has-flyout.pinned .flyout-panel {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(0);
      }

      .flyout-list {
        list-style: none;
        margin: 0;
        padding: 0.6rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }

      .flyout-link {
        display: block;
        padding: 0.6rem 0.75rem;
        border-radius: 10px;
        font-size: var(--fs-sub-desc);
        color: var(--ink);
        transition: background 0.2s ease;
      }

      .flyout-link:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      /* ===================== RIGHT SECTION ===================== */
      .nav-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.6rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        font-size: var(--fs-btn);
        font-weight: 500;
        padding: 0.6rem clamp(0.9rem, 1.6vw, 1.4rem);
        border-radius: 999px;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          border-color 0.2s ease;
      }

      .btn-ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
      }

      .btn-ghost:hover {
        border-color: #3d4048;
        background: rgba(255, 255, 255, 0.04);
      }

      .btn-solid {
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #1a1305;
        font-weight: 600;
      }

      .btn-solid:hover {
        transform: translateY(-1px);
      }

      /* ===================== HAMBURGER ===================== */
      .hamburger {
        width: 26px;
        height: 20px;
        position: relative;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
      }

      .hamburger .bar {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        border-radius: 2px;
        background: var(--ink);
      }

      .bar1 {
        top: 0;
      }
      .bar2 {
        top: 9px;
      }
      .bar3 {
        top: 18px;
      }

      /* ===================== MOBILE OVERLAY ===================== */
      .mobile-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 400;
        display: none;
        overflow-y: auto;
      }

      .mobile-overlay-inner {
        padding: calc(var(--nav-h) + 1.5rem) clamp(1.25rem, 6vw, 3rem) 3rem;
        max-width: 560px;
        margin: 0 auto;
      }

      .m-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .m-item {
        border-bottom: 1px solid var(--line);
      }

      .m-link {
        all: unset;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 1.1rem 0.1rem;
        font-size: var(--fs-mobile);
        font-family: "Fraunces", serif;
        color: var(--ink);
        cursor: pointer;
      }

      .m-item[data-depth="1"] > .m-link,
      .m-item[data-depth="2"] > .m-link {
        font-family: "Inter", sans-serif;
        font-size: calc(var(--fs-mobile) * 0.72);
        color: var(--muted);
        padding: 0.85rem 0.1rem;
      }

      .m-item[data-depth="1"] {
        border-bottom: 1px dashed var(--line);
        padding-left: 1rem;
      }
      .m-item[data-depth="2"] {
        border-bottom: none;
        padding-left: 2rem;
      }

      .m-panel {
        height: 0;
        overflow: hidden;
      }

      .m-panel-inner {
        padding-bottom: 0.5rem;
      }

      .m-item.open > .m-link {
        color: var(--accent);
      }

      .mobile-actions {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .mobile-actions .btn {
        width: 100%;
        padding: 0.9rem;
        font-size: var(--fs-btn);
      }

      /* ===================== RESPONSIVE SWITCH ===================== */
      @media (min-width: 960px) {
        .mobile-only {
          display: none !important;
        }
      }

      @media (max-width: 959px) {
        .desktop-only {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <a href="#" class="logo">Lumen<span class="dot">.</span></a>

        <div class="nav-center desktop-only">
          <ul class="nav-list" id="desktopNavList"></ul>
        </div>

        <div class="nav-right">
          <div
            class="nav-actions desktop-only"
            style="display: flex; gap: 0.6rem"
          >
            <a href="#" class="btn btn-ghost">Log in</a>
            <a href="#" class="btn btn-solid">Sign up free</a>
          </div>

          <button
            class="hamburger mobile-only"
            id="hamburgerBtn"
            aria-label="Toggle menu"
            aria-expanded="false"
          >
            <span class="bar bar1"></span>
            <span class="bar bar2"></span>
            <span class="bar bar3"></span>
          </button>
        </div>
      </div>
    </nav>

    <div class="mobile-overlay mobile-only" id="mobileOverlay">
      <div class="mobile-overlay-inner">
        <ul class="m-list" id="mobileNavList"></ul>
        <div class="mobile-actions">
          <a href="#" class="btn btn-ghost">Log in</a>
          <a href="#" class="btn btn-solid">Sign up free</a>
        </div>
      </div>
    </div>

    <div class="page-filler">
      <h1>This is just a demo page behind the navbar.</h1>
      <p>
        Resize your browser below 960px width to see the navbar collapse into a
        hamburger menu.
      </p>
    </div>

    <script>
      /* ===================== DATA ===================== */
      const navData = [
        { label: "Products", href: "https://google.com" },
        { label: "Solutions", href: "https://google.com" },
        { label: "Resources", href: "https://google.com" },
        { label: "Pricing", href: "https://google.com" },
        { label: "Company", href: "https://google.com" },
      ];

      const chevronDownSvg =
        '<svg class="chevron" viewBox="0 0 24 24" width="14" height="14"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const chevronRightSvg =
        '<svg class="chevron chevron-right" viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      /* ===================== DESKTOP RENDER ===================== */
      function renderDesktopTop(data) {
        return data
          .map((item) => {
            const hasChildren = item.children && item.children.length;
            return `
      <li class="nav-item">
        <a href="${item.href || "#"}" class="nav-link">
          <span>${item.label}</span>
          ${hasChildren ? chevronDownSvg : ""}
        </a>
        ${
          hasChildren
            ? `
        <div class="dropdown-panel">
          <div class="dropdown-inner">
            <ul class="dropdown-list">
              ${item.children.map(renderDesktopSub).join("")}
            </ul>
          </div>
        </div>`
            : ""
        }
      </li>`;
          })
          .join("");
      }

      function renderDesktopSub(child) {
        const hasChildren = child.children && child.children.length;
        const body = `
    <span>
      <span class="dropdown-link-title">${child.label}</span>
      ${child.desc ? `<span class="dropdown-link-desc">${child.desc}</span>` : ""}
    </span>`;

        if (hasChildren) {
          return `
      <li class="dropdown-item has-flyout">
        <button type="button" class="dropdown-link">
          ${body}
          ${chevronRightSvg}
        </button>
        <div class="flyout-panel">
          <ul class="flyout-list">
            ${child.children.map((sub) => `<li><a href="${sub.href || "#"}" class="flyout-link">${sub.label}</a></li>`).join("")}
          </ul>
        </div>
      </li>`;
        }

        return `
    <li class="dropdown-item">
      <a href="${child.href || "#"}" class="dropdown-link">${body}</a>
    </li>`;
      }

      document.getElementById("desktopNavList").innerHTML =
        renderDesktopTop(navData);

      /* ===================== MOBILE RENDER ===================== */
      function renderMobile(data, depth) {
        return data
          .map((item) => {
            const hasChildren = item.children && item.children.length;
            if (hasChildren) {
              return `
        <li class="m-item" data-depth="${depth}">
          <button type="button" class="m-link">
            <span>${item.label}</span>
            ${chevronDownSvg}
          </button>
          <div class="m-panel">
            <div class="m-panel-inner">
              <ul>${renderMobile(item.children, depth + 1)}</ul>
            </div>
          </div>
        </li>`;
            }
            return `
      <li class="m-item" data-depth="${depth}">
        <a href="${item.href || "#"}" class="m-link m-leaf">${item.label}</a>
      </li>`;
          })
          .join("");
      }

      document.getElementById("mobileNavList").innerHTML = renderMobile(
        navData,
        0,
      );

      /* ===================== DESKTOP INTERACTIONS ===================== */
      const topItems = Array.from(
        document.querySelectorAll("#desktopNavList > .nav-item"),
      );

      // Align first/last dropdown panels so they don't overflow the viewport edge
      if (topItems.length) {
        const firstPanel = topItems[0].querySelector(
          ":scope > .dropdown-panel",
        );
        const lastPanel = topItems[topItems.length - 1].querySelector(
          ":scope > .dropdown-panel",
        );
        if (firstPanel) firstPanel.classList.add("align-start");
        if (lastPanel) {
          lastPanel.classList.add("align-end");
          lastPanel
            .querySelectorAll(":scope .has-flyout")
            .forEach((el) => el.classList.add("flyout-left"));
        }
      }

      function togglePin(el, siblings) {
        const wasPinned = el.classList.contains("pinned");
        siblings.forEach((sib) => {
          if (sib !== el) {
            sib.classList.remove("pinned");
            sib
              .querySelectorAll(".pinned")
              .forEach((nested) => nested.classList.remove("pinned"));
          }
        });
        if (wasPinned) {
          el.classList.remove("pinned");
          el.querySelectorAll(".pinned").forEach((nested) =>
            nested.classList.remove("pinned"),
          );
        } else {
          el.classList.add("pinned");
        }
      }

      function closeAllDesktopPins() {
        document
          .querySelectorAll(".navbar .pinned")
          .forEach((el) => el.classList.remove("pinned"));
      }

      topItems.forEach((item) => {
        const link = item.querySelector(":scope > .nav-link");
        link.addEventListener("click", (e) => {
          if (item.querySelector(":scope > .dropdown-panel")) {
            e.stopPropagation();
            togglePin(item, topItems);
          }
        });

        // level-3 flyout toggles, scoped to this top-level item's own submenu
        const flyoutParents = Array.from(item.querySelectorAll(".has-flyout"));
        flyoutParents.forEach((fp) => {
          const fpLink = fp.querySelector(":scope > .dropdown-link");
          const siblingGroup = Array.from(
            fp.parentElement.querySelectorAll(":scope > .has-flyout"),
          );
          fpLink.addEventListener("click", (e) => {
            e.stopPropagation();
            togglePin(fp, siblingGroup);
          });
        });

        // leaf links close everything after "navigating"
        item
          .querySelectorAll("a.dropdown-link, a.flyout-link")
          .forEach((leaf) => {
            leaf.addEventListener("click", (e) => {
              closeAllDesktopPins();
            });
          });
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".navbar")) closeAllDesktopPins();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAllDesktopPins();
      });

      /* ===================== MOBILE INTERACTIONS ===================== */
      const hamburgerBtn = document.getElementById("hamburgerBtn");
      const mobileOverlay = document.getElementById("mobileOverlay");
      const mobileNavList = document.getElementById("mobileNavList");
      let mobileOpen = false;

      function morphHamburger(open) {
        if (open) {
          gsap.to("#hamburgerBtn .bar1", {
            y: 9,
            rotate: 45,
            duration: 0.35,
            ease: "power2.inOut",
          });
          gsap.to("#hamburgerBtn .bar2", { opacity: 0, duration: 0.2 });
          gsap.to("#hamburgerBtn .bar3", {
            y: -9,
            rotate: -45,
            duration: 0.35,
            ease: "power2.inOut",
          });
        } else {
          gsap.to("#hamburgerBtn .bar1", {
            y: 0,
            rotate: 0,
            duration: 0.35,
            ease: "power2.inOut",
          });
          gsap.to("#hamburgerBtn .bar2", {
            opacity: 1,
            duration: 0.2,
            delay: 0.15,
          });
          gsap.to("#hamburgerBtn .bar3", {
            y: 0,
            rotate: 0,
            duration: 0.35,
            ease: "power2.inOut",
          });
        }
      }

      function collapseAllMobileAccordions() {
        mobileNavList.querySelectorAll(".m-item.open").forEach((li) => {
          li.classList.remove("open");
          const panel = li.querySelector(":scope > .m-panel");
          const chevron = li.querySelector(":scope > .m-link .chevron");
          gsap.set(panel, { height: 0 });
          if (chevron) gsap.set(chevron, { rotate: 0 });
        });
      }

      function openMobileOverlay() {
        mobileOpen = true;
        hamburgerBtn.setAttribute("aria-expanded", "true");
        document.body.style.overflow = "hidden";
        morphHamburger(true);

        gsap.set(mobileOverlay, { display: "block" });
        gsap.fromTo(
          mobileOverlay,
          { autoAlpha: 0 },
          { autoAlpha: 1, duration: 0.35, ease: "power2.out" },
        );

        const items = mobileNavList.querySelectorAll(":scope > .m-item");
        gsap.fromTo(
          items,
          { y: 16, opacity: 0 },
          {
            y: 0,
            opacity: 1,
            duration: 0.45,
            stagger: 0.05,
            delay: 0.1,
            ease: "power3.out",
          },
        );
        gsap.fromTo(
          ".mobile-actions",
          { y: 16, opacity: 0 },
          {
            y: 0,
            opacity: 1,
            duration: 0.45,
            delay: 0.1 + items.length * 0.05,
            ease: "power3.out",
          },
        );
      }

      function closeMobileOverlay() {
        mobileOpen = false;
        hamburgerBtn.setAttribute("aria-expanded", "false");
        document.body.style.overflow = "";
        morphHamburger(false);

        gsap.to(mobileOverlay, {
          autoAlpha: 0,
          duration: 0.3,
          ease: "power2.in",
          onComplete: () => {
            gsap.set(mobileOverlay, { display: "none" });
            collapseAllMobileAccordions();
          },
        });
      }

      hamburgerBtn.addEventListener("click", () => {
        if (mobileOpen) closeMobileOverlay();
        else openMobileOverlay();
      });

      function toggleMobileItem(li) {
        const isOpen = li.classList.contains("open");
        const panel = li.querySelector(":scope > .m-panel");
        const inner = panel.querySelector(":scope > .m-panel-inner");
        const chevron = li.querySelector(":scope > .m-link .chevron");

        if (isOpen) {
          li.classList.remove("open");
          gsap.to(panel, { height: 0, duration: 0.35, ease: "power2.inOut" });
          if (chevron) gsap.to(chevron, { rotate: 0, duration: 0.3 });
        } else {
          li.classList.add("open");
          const targetHeight = inner.offsetHeight;
          gsap.fromTo(
            panel,
            { height: 0 },
            { height: targetHeight, duration: 0.35, ease: "power2.inOut" },
          );
          if (chevron) gsap.to(chevron, { rotate: 180, duration: 0.3 });
        }
      }

      mobileNavList.querySelectorAll(".m-link:not(.m-leaf)").forEach((btn) => {
        btn.addEventListener("click", () =>
          toggleMobileItem(btn.closest(".m-item")),
        );
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth >= 960 && mobileOpen) closeMobileOverlay();
      });
    </script>
  </body>
</html>
